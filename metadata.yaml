name: astrbot_plugin_friend_guard
display_name: 好友守卫
short_desc: 发现被删之后，她自己把好友申请发回去
desc: |
  她被删掉的时候，不会有任何消息进来——没有事件能让她「反应」，
  模型也永远等不到那个可以回应的瞬间。所以这件事只能由插件盯着。

  **她能做的和不能做的**

  QQ 没有「凭一个 QQ 号直接成为好友」的接口，谁都没有。
  加好友永远是「A 发申请 → B 同意」。所以这里的「主动」指的是
  **由她这一侧把申请发出去**，主号那边还是要点一下同意。

  **三条路，从正规到笨拙**

  1. `可能认识的人`：QQ 基于共同群、共同好友、最近联系人维护的名单。
     主号刚把她删掉时几乎必然在里面——因为他就是"最近联系人"。
     对这条候选发起添加，就是一条真实的好友申请。
  2. 私聊：已经不是好友了，但 QQ 有时仍允许临时会话。发出去的话，
     主号会收到一条带「加好友」按钮的陌生人消息。
  3. 共同群：前两条都不通时，在第一个共同群里 @ 他一句，附一张加好友名片。

  **三道防误伤的闸**

  - 本次运行里必须先真的见过他在好友列表里，否则一律不动（挡住配置写错）；
  - 单向好友列表（`get_unidirectional_friend_list`）确认有他 = 立刻动手；
    只是"列表里没有" = 再等几轮复核；
  - 一天最多试几次、两次隔多久，全在配置里。

  **加回来之后**

  她不会装作什么都没发生，会主动说一句配置里写好的话。
  回复风格、标点习惯都跟人格一致——不提「系统」「恢复」这类词。
help: |
  **命令（管理员）**

  - `/好友状态` —— 在不在列表里、今天还能试几次、上次动了什么手
  - `/加回我` —— 立刻走一次完整流程，不看冷却和次数
  - `/重加自检` —— 只探测三条路通不通，不发任何申请

  **配置要点**

  - `owner_qq`：只盯这一个人。配错等于不工作（她不会瞎加人）。
  - `max_attempts_per_day` / `attempt_cooldown_minutes`：
    反复发申请会触发 QQ 风控，别调得太激进。
  - `allow_group`：群是公开场合，介意「在群里喊人」就关掉。
  - `auto_approve_request`：只管 `owner_qq` 的申请，别人的照旧人工。

  **一个已知边界**

  如果她在本次运行里**从来没**成功读到过你在好友列表里（比如刚装插件、
  而你恰好已经把她删了），她不会动手——因为分不清是"被删"还是"配错了号"。
  这种情况敲一次 `/加回我` 就好，之后就会自己盯着。
